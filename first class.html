<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Student Registration Portal</h1>
    <label for="fullname">Full name : </label>
    <input type="text" id="fullname" name="full name" placeholder="eg. Gaurav">

    <br>
  

    <label for="email">Email : </label>
    <input type="email" id="email" name="email" placeholder="eg. gaurav@gmail.com">

    <br>

    <label for="age">Age : </label>
    <input type="number" name="age" id="age" placeholder="eg. 18">

    <br>

    <label for="date">Date Of Birth : </label>
    <input type="date" name="dateofbirth" id="dateofbirth">

    <br>

    <label for="gender">Gender : </label>
    
    <input type="radio" name="gender" id="Male" value="Male">
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female" value="female">
    <label for="female">Female</label>
    

    <input type="radio" name="gender" id="other" value="other">
    <label for="other">Other</label>

    <br>

    <label>Skill : </label>
    <br>
    <input type="checkbox" name="skill" id="Java" value="Java">
    <label for = "Java">Java</label>

    <input type="checkbox" name="skill" id="JavaScript" value="JavaScript">
    <label for = "JavaScript">JavaScript</label>

    <input type="checkbox" name="skill" id="C++" value="C++">
    <label for = "C++">C++</label>
    <br>

    <label>select branch:</label><br>

    <select name="" id="">
        <option>--SELECT--</option>
        <option value = "cse" id ="">CSE</option>
        <option value = "IT" id ="">IT</option>
        <option value = "ece" id ="">ECE</option>


    </select>
    



</body>

</html>
